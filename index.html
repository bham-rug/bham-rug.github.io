<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Birmingham R Users Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: white;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            max-height: 200px;
            margin-bottom: 10px;
        }
        h1 {
            margin-top: 0;
        }
        .btn-primary {
            background-color: #C70F2E;
            border-color: #C70F2E;
        }
        .btn-primary:hover {
            background-color: #A10C24;
            border-color: #A10C24;
        }
        .btn-custom {
            background-color: #c70f2e;
            color: white;
            border: 1px solid #c70f2e;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #8b0a1f;
            color: white;
            border-color: #8b0a1f;
        }
        @media (max-width: 768px) {
            .d-flex {
                flex-direction: column;
            }
            input[type="email"] {
                margin-bottom: 10px;
                width: 100%;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="text-center">
            <!-- Logo Placeholder -->
            <div>
                <img src="bham-rug-logo.png" alt="Birmingham R Users Group Logo" class="img-fluid logo">
            </div>
            
            <h1 class="mb-3">Join Birmingham's R Users Group</h1>
            <p class="mb-4">Are you interested in learning about the R programming language, growing your expertise, or connecting with other R users? Join our community!</p>

            <!-- Social Links -->
            <div class="mb-4">
                <a href="https://www.meetup.com/bham-r-users-group/" target="_blank" class="btn btn-custom me-2 mb-2">
                    <i class="fas fa-calendar-alt me-2"></i>Join us on Meetup
                </a>
                <a href="https://bsky.app/profile/bham-rug.bsky.social" target="_blank" class="btn btn-custom mb-2">
                    <i class="fas fa-cloud me-2"></i>Follow us on Bluesky
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
